<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>참가 신청 — 학교스포츠클럽대회</title>
<meta name="description" content="학교스포츠클럽대회 참가 신청">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand">마이스포츠클럽<span>.</span></a>
    <nav class="site-nav">
      <a href="index.html">홈</a>
      <a href="apply.html" aria-current="page">참가 신청</a>
      <a href="results.html">대회 결과</a>
    </nav>
  </div>
</header>

<section class="block">
  <div class="wrap">
    <span class="bib">참가 신청</span>
    <h2 style="margin-top:14px;">학교스포츠클럽대회 참가 신청</h2>
    <p class="sub">아래 양식을 작성해 제출하면 접수가 완료됩니다. 접수 확인 문자는 별도로 발송되지 않습니다.</p>

    <div class="notice-card">
      <h2>신청 전 확인해 주세요</h2>
      <ul>
        <li>접수 기간: 2026. 03. 16(월) ~ 03. 27(금) 18:00까지</li>
        <li>학급당 종목별 1개 팀만 신청 가능합니다.</li>
        <li>제출 후 수정이 필요하면 같은 내용으로 다시 제출해 주세요.</li>
        <li>문의사항은 체육교육팀으로 연락 바랍니다.</li>
      </ul>
    </div>

    <form id="applyForm" class="apply-form">
      <div class="form-row">
        <div class="field">
          <label for="grade">학년 *</label>
          <select id="grade" name="grade" required>
            <option value="">선택</option>
            <option>1학년</option>
            <option>2학년</option>
            <option>3학년</option>
          </select>
        </div>
        <div class="field">
          <label for="classNo">반 *</label>
          <input type="text" id="classNo" name="classNo" placeholder="예: 3반" required>
        </div>
      </div>

      <div class="field">
        <label for="sport">신청 종목 *</label>
        <select id="sport" name="sport" required>
          <option value="">선택</option>
          <option>축구</option>
          <option>배드민턴</option>
          <option>피구</option>
          <option>줄넘기</option>
          <option>탁구</option>
          <option>육상</option>
        </select>
      </div>

      <div class="form-row">
        <div class="field">
          <label for="leaderName">대표자 이름 *</label>
          <input type="text" id="leaderName" name="leaderName" required>
        </div>
        <div class="field">
          <label for="contact">연락처 *</label>
          <input type="tel" id="contact" name="contact" placeholder="010-0000-0000" required>
        </div>
      </div>

      <div class="field">
        <label for="members">팀원 명단 (선택)</label>
        <textarea id="members" name="members" rows="3" placeholder="예: 홍길동, 김철수, 이영희"></textarea>
      </div>

      <div class="field">
        <label for="note">비고 (선택)</label>
        <textarea id="note" name="note" rows="2"></textarea>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">신청서 제출</button>
      <p id="formStatus" class="form-status" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <span>마이스포츠클럽 · 학교스포츠클럽대회</span>
    <span><a href="admin.html" style="color:inherit;">관리자</a></span>
  </div>
</footer>

<script src="config.js"></script>
<script type="module" src="apply.js"></script>
</body>
</html>
