# claude/ 브랜치에 푸시되면 main으로 PR을 자동으로 만들고 바로 병합합니다.
# main에 병합되면 Vercel이 자동 배포하므로 별도 배포 단계는 없습니다.
# 필요 설정: 저장소 Settings → Actions → General →
#   "Allow GitHub Actions to create and approve pull requests" 체크
name: claude 브랜치 자동 PR·병합

on:
  push:
    branches:
      - "claude/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: PR 생성 후 main에 병합
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # main보다 앞선 커밋이 없으면(이미 병합됨) 할 일 없음
          ahead=$(gh api "repos/$GH_REPO/compare/main...$SHA" --jq .ahead_by)
          if [ "$ahead" = "0" ]; then
            echo "main에 이미 반영된 커밋입니다. 건너뜁니다."
            exit 0
          fi

          pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            title=$(gh api "repos/$GH_REPO/commits/$SHA" --jq '.commit.message | split("\n")[0]')
            url=$(gh pr create --base main --head "$BRANCH" --title "$title" \
              --body "\`$BRANCH\` 브랜치 푸시로 자동 생성된 PR입니다. 병합되면 Vercel이 자동 배포합니다.")
            pr="${url##*/}"
            echo "PR 생성: $url"
          fi

          # 이 실행이 본 커밋까지만 병합 (그 사이 새 푸시가 있으면 다음 실행이 처리)
          gh pr merge "$pr" --merge --match-head-commit "$SHA"
          echo "PR #$pr 병합 완료"
