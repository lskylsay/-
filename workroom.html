<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>업무실 · 스포츠클럽마이 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Black+Han+Sans&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --turf:#1E4A38; --turf-2:#2C6650; --chalk:#FFFFFF; --ground:#F2F4F1; --line:#D6DDD8;
  --ink:#16201B; --ink-2:#56635C; --bib:#F2C230; --warn:#C2410C; --ok:#2F7D4F;
  --card:#FFFFFF; --shade:#E8ECE9;
  --f:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --num:'Black Han Sans','IBM Plex Sans KR',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#121815; --card:#1A221E; --ink:#E7ECE9; --ink-2:#9AA8A0; --line:#2B3731; --shade:#232D28;
  --turf:#2C6650; --turf-2:#3B7D63; --chalk:#E7ECE9;
}}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--bib);outline-offset:2px}

/* layout */
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.side{background:var(--turf);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;
  background-image:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.07) 46px 48px)}
.brand{font-family:var(--num);font-size:24px;letter-spacing:.5px;padding:4px 10px 18px}
.brand small{display:block;font-family:var(--f);font-size:12px;opacity:.75;font-weight:500}
.nav button{all:unset;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:500;color:rgba(255,255,255,.85)}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button[aria-current="page"]{background:#fff;color:var(--turf);font-weight:700}
.nav{display:flex;flex-direction:column;gap:2px}
.side .who{margin-top:auto;font-size:12px;opacity:.8;padding:10px}
.side .who button{all:unset;cursor:pointer;text-decoration:underline;margin-top:4px;display:block}
main{padding:28px clamp(16px,3vw,40px) 90px;max-width:1240px;width:100%}
h1{font-size:26px;margin:0 0 4px;font-weight:700;letter-spacing:-.5px}
.sub{color:var(--ink-2);margin:0 0 22px}
h2{font-size:17px;margin:0 0 12px;font-weight:700}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--ink-2)}
.small{font-size:13px}

/* bib cards: the one memorable element */
.bibs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:18px}
.bib{background:#fff;color:#16201B;border:2px solid #16201B;border-radius:6px;padding:12px 14px 14px;position:relative;cursor:pointer;text-align:left}
.bib::before,.bib::after{content:"";position:absolute;top:8px;width:7px;height:7px;border-radius:50%;background:var(--ground);border:1.5px solid #16201B}
.bib::before{left:8px}.bib::after{right:8px}
.bib .dd{font-family:var(--num);font-size:46px;line-height:1;margin:10px 0 6px;letter-spacing:1px}
.bib .dd.soon{color:var(--warn)}
.bib .nm{font-weight:700;font-size:15px}
.bib .meta{font-size:12.5px;color:#56635C}
.bib .bar{height:6px;background:#E8ECE9;border-radius:3px;margin-top:10px;overflow:hidden}
.bib .bar i{display:block;height:100%;background:var(--turf)}
.bib.sponsor{border-top:12px solid var(--bib)}

/* form controls */
input[type=text],input[type=email],input[type=password],input[type=date],input[type=number],select,textarea{
  border:1px solid var(--line);background:var(--card);border-radius:7px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:90px;resize:vertical;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2);font-weight:500}
label.f input,label.f select,label.f textarea{color:var(--ink);font-size:14.5px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--turf);color:#fff;border-color:var(--turf)}
.btn.pri:hover{background:var(--turf-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}

/* lists & tables */
.tasks{list-style:none;margin:0;padding:0}
.tasks li{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-bottom:1px solid var(--line)}
.tasks li:last-child{border-bottom:0}
.tasks input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--turf);flex:none}
.tasks .t{flex:1;min-width:0}
.tasks .done .t span.tt{text-decoration:line-through;color:var(--ink-2)}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--shade);color:var(--ink-2);margin-right:4px;font-weight:500}
.tag.late{background:#FDE6DA;color:#9A3412}
.tag.today{background:var(--bib);color:#16201B}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--shade);font-weight:600;position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td input{width:100%;padding:5px 7px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-width:120px}
.stat b{font-family:var(--num);font-size:26px;display:block;line-height:1.1;font-weight:400}
.stat span{font-size:12.5px;color:var(--ink-2)}
.empty{padding:22px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:8px}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;font-weight:600;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--turf)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cal .h{background:var(--shade);text-align:center;font-size:12px;font-weight:600;padding:5px}
.cal .d{background:var(--card);min-height:84px;padding:4px 5px;font-size:12px;cursor:pointer}
.cal .d.o{opacity:.4}
.cal .d.td .n{background:var(--turf);color:#fff;border-radius:50%;display:inline-grid;place-items:center;width:22px;height:22px}
.cal .d .n{font-weight:600}
.cal .ev{display:block;font-size:11px;padding:1px 4px;border-radius:3px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--shade)}
.cal .ev.p{background:var(--bib);color:#16201B;font-weight:600}
.cal .ev.x{text-decoration:line-through;opacity:.6}

/* doc preview: looks like a 공문 page */
.paper{background:#fff;color:#111;border:1px solid var(--line);padding:36px 40px;font-family:'Batang','바탕',serif;font-size:14.5px;line-height:1.8;max-height:75vh;overflow:auto}
.paper h3{font-family:var(--f);text-align:center;font-size:19px;border:2px solid #111;border-radius:12px;padding:10px;margin:0 0 6px}
.paper .team{text-align:right;font-size:13px;margin-bottom:14px}
.paper h4{font-family:var(--f);font-size:16px;margin:18px 0 6px}
.paper p{margin:2px 0}
.paper .i1{padding-left:1.2em}.paper .i2{padding-left:2.4em}
.paper table{font-size:13px;margin:6px 0;border:1px solid #111}
.paper th,.paper td{border:1px solid #111;text-align:center;white-space:normal;color:#111}
.paper th{background:#EAEAEA;position:static}

dialog{border:0;border-radius:12px;padding:0;max-width:min(720px,94vw);width:100%;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,15,.45)}
dialog .dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
dialog .db{padding:18px 20px;max-height:70vh;overflow:auto}
dialog .df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding:20px;background:var(--turf);
  background-image:repeating-linear-gradient(90deg,transparent 0 58px,rgba(255,255,255,.08) 58px 61px)}
.login form{background:var(--card);border-radius:12px;padding:28px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.login .brand{color:var(--ink);padding:0 0 6px;font-size:30px}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:40;background-image:none}
  .brand,.side .who{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px}
  .nav button svg{width:20px;height:20px}
  main{padding:18px 14px 110px}
  .paper{padding:20px 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status"></div>
<dialog id="dlg"></dialog>

<script>
/* ============ 설정 ============ */
const CONFIG = {
  SUPABASE_URL: 'https://whlkngqhbszxxdmhnilx.supabase.co',
  SUPABASE_KEY: 'sb_publishable_c-yL67asfZua8fEBCF2yoA_2h3VitpG',
  ADMIN_EMAIL: 'dkjy0906@gmail.com',
  ORG: '충청북도제천교육지원청',
  TEAM: '교육과 체육교육팀',
  SITE: '스포츠클럽마이'
};
const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);

/* ============ 유틸 ============ */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso = d => d.toLocaleDateString('sv-SE');
const TODAY = () => iso(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((new Date(a + 'T00:00:00') - new Date(b + 'T00:00:00')) / 864e5);
const WD = ['일','월','화','수','목','금','토'];
const kdate = s => { if (!s) return ''; const d = new Date(s + 'T00:00:00'); return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.(${WD[d.getDay()]})`; };
const sdate = s => { if (!s) return ''; const d = new Date(s + 'T00:00:00'); return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`; };
const won = n => (Number(n) || 0).toLocaleString('ko-KR');
const ddLabel = s => { const n = diffDays(s, TODAY()); return n === 0 ? 'D-DAY' : n > 0 ? `D-${n}` : `D+${-n}`; };
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2200); }
async function q(p){ const { data, error } = await p; if (error){ console.error(error); toast('저장 실패: ' + error.message); throw error; } return data; }
function csvDownload(name, rows){
  const csv = '﻿' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'})); a.download = name; a.click();
}

/* ============ 기본 워크플로우 템플릿 ============ */
const DEFAULT_WORKFLOWS = [
  { name:'대회·축제 운영 (행사형)', kind:'대회', steps:[
    [-60,'운영(안) 기안·결재','기획'],[-55,'예산 품의·집행계획 확정','예산'],[-50,'대회 요강 확정·누리집 게시','홍보'],
    [-45,'학교 안내 공문 시행','공문'],[-30,'장소 사용 승인·안전관리계획 수립','안전'],[-28,'심판·운영요원 위촉','인력'],
    [-21,'물품(메달·배번·기념품) 구입','예산'],[-14,'참가신청 마감·명단 확정','접수'],[-12,'배번 부여·참가현황 집계','접수'],
    [-10,'세부운영계획 시행','공문'],[-7,'단체 상해보험 가입','안전'],[-3,'대표자·운영요원 협의회','인력'],
    [-1,'경기장 설치·물품 최종 점검','현장'],[0,'대회 운영','현장'],[3,'결과 게시·상장 발송','결과'],
    [7,'결과보고 기안','공문'],[14,'예산 정산·지출 마감','예산'] ]},
  { name:'특강·연수 운영', kind:'특강', steps:[
    [-40,'운영(안) 기안·결재','기획'],[-30,'강사 섭외·위촉','인력'],[-25,'안내 공문 시행','공문'],[-10,'참가 신청 마감','접수'],
    [-7,'장소·기자재 점검','현장'],[0,'특강 운영','현장'],[3,'만족도 조사 취합','결과'],[7,'결과보고·강사수당 지급','예산'] ]},
  { name:'학교스포츠클럽 리그 (시즌형)', kind:'리그', steps:[
    [-60,'리그 운영계획 기안','기획'],[-45,'참가팀 신청 접수','접수'],[-30,'대진 편성·공문 시행','공문'],[0,'리그 개막','현장'],
    [60,'중간 점검·순위 공지','결과'],[120,'결승·시상','현장'],[130,'결과보고·정산','예산'] ]},
  { name:'예산 정산', kind:'예산', steps:[
    [-30,'사업별 집행 현황 점검','예산'],[-14,'미집행 잔액 확인·전용 검토','예산'],[-7,'증빙서류 취합','예산'],[0,'정산서 제출','공문'] ]}
];
const stepsToText = steps => steps.map(([o,t,c]) => `${o===0?'D-DAY':o<0?'D'+o:'D+'+o} | ${t} | ${c||''}`).join('\n');
function textToSteps(txt){
  return txt.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const [a,b,c] = l.split('|').map(s => (s||'').trim());
    let o = 0; const m = a.replace(/\s/g,'').toUpperCase().match(/^D([+-]\d+)?/);
    if (m && m[1]) o = parseInt(m[1],10); else if (/^-?\d+$/.test(a)) o = parseInt(a,10);
    return [o, b || a, c || ''];
  });
}

/* ============ 상태 ============ */
const S = { user:null, view:'home', projects:[], tasks:[], workflows:[], budget:[], docs:[], apps:null, calMonth:null, selProject:null };

async function loadAll(){
  const [p,t,w,b,d] = await Promise.all([
    q(sb.from('admin_projects').select('*').order('event_date',{ascending:true,nullsFirst:false})),
    q(sb.from('admin_tasks').select('*').order('due_date',{ascending:true,nullsFirst:false})),
    q(sb.from('admin_workflows').select('*').order('id')),
    q(sb.from('admin_budget').select('*').order('id')),
    q(sb.from('admin_documents').select('id,created_at,updated_at,project_id,doc_type,title').order('updated_at',{ascending:false}))
  ]);
  Object.assign(S,{projects:p,tasks:t,workflows:w,budget:b,docs:d});
  if (!w.length){
    await q(sb.from('admin_workflows').insert(DEFAULT_WORKFLOWS));
    S.workflows = await q(sb.from('admin_workflows').select('*').order('id'));
  }
}
async function loadApps(force){
  if (S.apps && !force) return S.apps;
  let all = [], from = 0;
  while (true){
    const rows = await q(sb.from('applications').select('id,created_at,grade,class_no,sport,leader_name,contact,members,note,competition,bib_number').order('id').range(from, from+999));
    all = all.concat(rows); if (rows.length < 1000) break; from += 1000;
  }
  S.apps = all.map(parseApp); return S.apps;
}
function parseApp(r){
  const parts = String(r.members||'').split('·').map(s => s.trim());
  const m = String(r.members||'').match(/배번\s*(\d+)(?:\s*\(([^)]+)\))?/);
  return { ...r, gender: parts[0]||'', role: parts[1]||'', bibText: m ? +m[1] : null, color: m && m[2] ? m[2] : '', gate: parts[3]||'',
    sportShort: String(r.sport||'').split('(')[0].trim(), bib: r.bib_number ?? (m ? +m[1] : null) };
}
const projName = id => (S.projects.find(p => p.id === id)||{}).name || '';

/* ============ 아이콘 ============ */
const IC = {
  home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  proj:'<path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="16" r="3"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  doc:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>',
  comp:'<path d="M5 20V9M12 20V4M19 20v-7"/>',
  money:'<rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/>'
};
const icon = k => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
const NAV = [['home','오늘','home'],['projects','사업·워크플로우','proj'],['calendar','일정·할일','cal'],['docs','공문 초안','doc'],['comp','대회 관리','comp'],['budget','예산','money']];

/* ============ 렌더 루트 ============ */
function renderLogin(msg){
  $('#root').innerHTML = `<div class="login"><form id="lf">
    <div class="brand">업무실<small>${CONFIG.SITE} 관리자</small></div>
    <label class="f">관리자 이메일<input type="email" id="le" required value="${esc(CONFIG.ADMIN_EMAIL)}" autocomplete="username"></label>
    <label class="f">비밀번호<input type="password" id="lp" autocomplete="current-password"></label>
    <button class="btn pri" type="submit">로그인</button>

function taskItem(t, showProj=true){

  return `<li class="${t.done?'done':''}"><input type="checkbox" data-tid="${t.id}" ${t.done?'checked':''} aria-label="${esc(t.title)} 완료">
    <div class="t"><span class="tt">${esc(t.title)}</span><div class="small muted">${tag}${t.due_date?sdate(t.due_date):'기한 없음'}${t.category?` · ${esc(t.category)}`:''}${showProj&&t.project_id?` · ${esc(projName(t.project_id))}`:''}</div></div>
    <button class="btn ghost small" data-edit="${t.id}" aria-label="수정">수정</button></li>`;
}
function bindTasks(root, after){
  root.querySelectorAll('[data-tid]').forEach(c => c.onchange = async () => {
    const t = S.tasks.find(x => x.id == c.dataset.tid); t.done = c.checked;
    await q(sb.from('admin_tasks').update({done:c.checked}).eq('id', t.id)); after && after(); });
  root.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => taskDialog(S.tasks.find(x => x.id == b.dataset.edit), after));
}

/* ============ 일정·할일 ============ */
function vCalendar(){
  const v = $('#view'); const today = TODAY();
  if (!S.calMonth) S.calMonth = today.slice(0,7);
  const [y,m] = S.calMonth.split('-').map(Number); const first = new Date(y, m-1, 1); const start = new Date(first); start.setDate(1 - first.getDay());
  const cells = []; for (let i=0;i<42;i++){ const d = new Date(start); d.setDate(start.getDate()+i); cells.push(iso(d)); }
  const ev = {}; S.tasks.forEach(t => t.due_date && (ev[t.due_date] = ev[t.due_date]||[]).push(t));
  const pv = {}; S.projects.forEach(p => p.event_date && (pv[p.event_date] = pv[p.event_date]||[]).push(p));
  const open = S.tasks.filter(t => !t.done);
  const groups = [['지난 일', open.filter(t => t.due_date && t.due_date < today)],['오늘', open.filter(t => t.due_date === today)],
    ['이번 주', open.filter(t => t.due_date > today && t.due_date <= addDays(today,7))],['이후', open.filter(t => !t.due_date || t.due_date > addDays(today,7))]];
  v.innerHTML = `<h1>일정·할일</h1><p class="sub">날짜를 누르면 그날 기한으로 할 일을 추가합니다.</p>
    <div class="grid" style="grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)" id="cg">
    <section class="panel"><div class="row" style="margin-bottom:10px"><button class="btn" id="pm" aria-label="이전 달">‹</button><h2 style="margin:0;min-width:110px;text-align:center">${y}년 ${m}월</h2><button class="btn" id="nm" aria-label="다음 달">›</button><span class="spacer"></span><button class="btn ghost" id="tm">오늘</button></div>
      <div class="cal">${WD.map(w => `<div class="h">${w}</div>`).join('')}${cells.map(c => `<div class="d ${c.slice(0,7)!==S.calMonth?'o':''} ${c===today?'td':''}" data-d="${c}"><span class="n">${+c.slice(8)}</span>
        ${(pv[c]||[]).map(p => `<span class="ev p">${esc(p.name)}</span>`).join('')}${(ev[c]||[]).slice(0,3).map(t => `<span class="ev ${t.done?'x':''}">${esc(t.title)}</span>`).join('')}${(ev[c]||[]).length>3?`<span class="small muted">+${ev[c].length-3}</span>`:''}</div>`).join('')}</div></section>
    <section class="panel"><div class="row"><h2 style="margin:0">남은 할 일</h2><span class="spacer"></span><button class="btn" id="at">+ 할 일</button></div>
      ${groups.map(([g,l]) => l.length ? `<h3 class="small muted" style="margin:14px 0 2px">${g} ${l.length}</h3><ul class="tasks">${l.map(t => taskItem(t)).join('')}</ul>` : '').join('') || '<div class="empty" style="margin-top:10px">남은 할 일이 없습니다.</div>'}
    </section></div>`;
  if (innerWidth < 900) $('#cg').style.gridTemplateColumns = '1fr';
  const mv = n => { const d = new Date(y, m-1+n, 1); S.calMonth = iso(d).slice(0,7); vCalendar(); };
  $('#pm').onclick = () => mv(-1); $('#nm').onclick = () => mv(1); $('#tm').onclick = () => { S.calMonth = today.slice(0,7); vCalendar(); };
  $('#at').onclick = () => taskDialog(null, vCalendar);
  v.querySelectorAll('[data-d]').forEach(c => c.onclick = () => taskDialog(null, vCalendar, { due_date:c.dataset.d }));
  bindTasks(v, vCalendar);
}

    return head('세부운영계획') +
    `<p><b>1. 대회명:</b> ${title}</p><p><b>2. 대회일시:</b> ${when}</p><p><b>3. 대회장소:</b> ${esc(f.place||'')}</p><p><b>4. 주최/주관:</b> ${esc(f.host||CONFIG.ORG)}</p>
     <p><b>5. 대회개요</b></p>${tg.map(t => `<p class="i1">- ${esc(t)}</p>`).join('')}
     <p><b>6. 종별 및 참가 부문</b></p>${lines(f.divisions).map(l => `<p class="i1">- ${esc(l)}</p>`).join('')}
     <p><b>7. 경기방법</b></p>${lines(f.method).map(l => `<p class="i1">- ${esc(l)}</p>`).join('')}
     <p><b>8. 시상</b></p>${lines(f.awards).map(l => `<p class="i1">- ${esc(l)}</p>`).join('')}
     <p><b>9. 세부 일정</b></p>${schedTable(f.schedule)}
     <h4>□ 행정사항</h4>${bullets(f.admin)}${st?`<h4>□ 학교별 참가 현황</h4>${st}`:''}`;
  }
  const st = f.competition ? statusTables(f.competition, apps) : '';
  return head('결과보고') +
    `<h4>1. 개요</h4>${overview}<h4>2. 참가 현황</h4>${st || '<p class="i1">○ 참가현황 연동에서 대회를 선택하면 표가 채워집니다.</p>'}
     <h4>3. 운영 결과</h4>${bullets(f.resultText)}<h4>4. 예산 집행 결과</h4>${budgetTable(f.project_id,true)}<h4>5. 성과 및 개선점</h4>${bullets(f.improve)}`;
}

/* ============ 대회 관리 ============ */
async function vComp(tab='list'){
  const v = $('#view'); v.innerHTML = `<h1>대회 관리</h1><p class="sub">누리집 참가신청 데이터를 바로 집계합니다.</p><div class="empty">신청 데이터를 불러오는 중…</div>`;
  const apps = await loadApps(true).catch(() => null); if (!apps){ v.querySelector('.empty').textContent = '신청 데이터를 읽지 못했습니다. 관리자 계정인지 확인하세요.'; return; }
  const comps = [...new Set(apps.map(a => a.competition).filter(Boolean))];
  S.compSel = S.compSel && comps.includes(S.compSel) ? S.compSel : comps[0];
  const as = apps.filter(a => a.competition === S.compSel);
  const sports = groupCount(as, a => a.sportShort), roles = groupCount(as, a => a.role||'미기재'), gens = groupCount(as, a => a.gender||'미기재');
  const bibCount = groupCount(as.filter(a => a.bib != null), a => a.bib); const dup = Object.entries(bibCount).filter(([,n]) => n>1).map(([b]) => b);
  const unsynced = as.filter(a => a.bib_number == null && a.bibText != null).length;
  v.innerHTML = `<h1>대회 관리</h1><p class="sub">누리집 참가신청 데이터를 바로 집계합니다.</p>
    <div class="row" style="margin-bottom:14px"><select id="cs" aria-label="대회 선택">${comps.map(c => `<option ${c===S.compSel?'selected':''}>${esc(c)}</option>`).join('')}</select><span class="spacer"></span><button class="btn" id="csv">명단 CSV</button></div>
    <div class="stats"><div class="stat"><b>${as.length}</b><span>전체 신청</span></div>${Object.entries(sports).map(([k,n]) => `<div class="stat"><b>${n}</b><span>${esc(k)}</span></div>`).join('')}
      <div class="stat"><b>${Object.keys(groupCount(as,a=>a.class_no)).length}</b><span>참가 학교</span></div>
      <div class="stat"><b>${Object.entries(roles).map(([k,n])=>n).join('·')}</b><span>${Object.keys(roles).join('·')}</span></div>
      <div class="stat"><b>${Object.entries(gens).map(([k,n])=>n).join('·')}</b><span>${Object.keys(gens).join('·')}</span></div></div>
    ${dup.length ? `<div class="panel" style="border-color:var(--warn);margin-bottom:14px"><b style="color:var(--warn)">배번 중복 ${dup.length}건</b> <span class="small">${dup.slice(0,20).join(', ')}${dup.length>20?' …':''}</span></div>` : ''}
    ${unsynced ? `<div class="panel" style="margin-bottom:14px"><div class="row"><span class="small">신청서에 적힌 배번 ${unsynced}건이 배번 칸(bib_number)에 아직 저장되지 않았습니다. 기록 연동 전에 저장해 두면 좋습니다.</span><span class="spacer"></span><button class="btn pri" id="sync">배번 저장</button></div></div>` : ''}
    <section class="panel" id="rw" style="margin-bottom:14px"><span class="small muted">기록원 접근 상태 확인 중…</span></section>
    <div class="tabs" role="tablist"><button role="tab" data-ct="list" aria-selected="${tab==='list'}">참가자 명단</button><button role="tab" data-ct="school" aria-selected="${tab==='school'}">학교별 현황</button><button role="tab" data-ct="res" aria-selected="${tab==='res'}">기록·결과</button></div><div id="cv"></div>`;
  $('#cs').onchange = e => { S.compSel = e.target.value; vComp(tab); };
  v.querySelectorAll('[data-ct]').forEach(b => b.onclick = () => vComp(b.dataset.ct));
  $('#csv').onclick = () => csvDownload(`${S.compSel}_참가자.csv`, [['ID','배번','색','이름','학교','성별','구분','부문','문','연락처','신청일시'], ...as.map(a => [a.id,a.bib,a.color,a.leader_name,a.class_no,a.gender,a.role,a.sportShort,a.gate,a.contact,new Date(a.created_at).toLocaleString('ko-KR')])]);
  $('#sync') && ($('#sync').onclick = async e => { e.target.disabled = true; const todo = as.filter(a => a.bib_number == null && a.bibText != null);
    for (let i=0;i<todo.length;i+=20){ await Promise.all(todo.slice(i,i+20).map(a => q(sb.from('applications').update({bib_number:a.bibText}).eq('id', a.id)))); e.target.textContent = `${Math.min(i+20,todo.length)}/${todo.length}`; }
    toast('배번을 저장했습니다'); vComp(tab); });
  recorderPanel(tab);
  const cv = $('#cv');
  if (tab === 'list'){
    cv.innerHTML = `<div class="row" style="margin-bottom:10px"><input type="text" id="sq" placeholder="이름·학교·배번 검색" style="flex:1;min-width:180px"><select id="sf"><option value="">전체 부문</option>${Object.keys(sports).map(s => `<option>${esc(s)}</option>`).join('')}</select></div><div class="tw" style="max-height:60vh"><table><thead><tr><th class="num">배번</th><th>이름</th><th>학교</th><th>성별</th><th>구분</th><th>부문</th><th>색·문</th><th>신청일</th></tr></thead><tbody id="tb"></tbody></table></div><p class="small muted" id="cnt"></p>`;
    const draw = () => { const s = $('#sq').value.trim(), sp = $('#sf').value;
      const r = as.filter(a => (!sp || a.sportShort === sp) && (!s || [a.leader_name,a.class_no,a.bib].join(' ').includes(s))).sort((a,b) => (a.bib??1e9)-(b.bib??1e9));
      $('#tb').innerHTML = r.map(a => `<tr${dup.includes(String(a.bib))?' style="background:#FDE6DA;color:#16201B"':''}><td class="num">${a.bib??''}</td><td>${esc(a.leader_name)}</td><td>${esc(a.class_no)}</td><td>${esc(a.gender)}</td><td>${esc(a.role)}</td><td>${esc(a.sportShort)}</td><td>${esc(a.color)} ${esc(a.gate)}</td><td>${sdate(iso(new Date(a.created_at)))}</td></tr>`).join('');
      $('#cnt').textContent = `${r.length}명 표시`; };
    $('#sq').oninput = draw; $('#sf').onchange = draw; draw();
  } else if (tab === 'school'){
    cv.innerHTML = `<div class="panel"><div class="paper" style="max-height:none;border:0;padding:0">${statusTables(S.compSel, apps)}</div></div>`;
  } else {
    const res = await q(sb.from('results').select('*').eq('competition', S.compSel).order('division').order('rank'));
    cv.innerHTML = `<div class="panel" style="margin-bottom:14px"><h2>기록 입력</h2><div class="fgrid">
      <label class="f">부문<select id="rd">${Object.keys(sports).map(s => `<option>${esc(s)}</option>`).join('')}</select></label>
      <label class="f">배번<input type="number" id="rb"></label><label class="f">순위<input type="number" id="rr"></label>
      <label class="f">기록<input type="text" id="rt" placeholder="00:18:42"></label><label class="f">비고<input type="text" id="rn"></label></div>
      <div class="row" style="margin-top:10px"><span class="small muted" id="rinfo"></span><span class="spacer"></span><button class="btn pri" id="radd">기록 추가</button></div></div>
      ${res.length ? `<div class="tw"><table><thead><tr><th>부문</th><th class="num">순위</th><th>이름</th><th>기록</th><th>비고</th></tr></thead><tbody>${res.map(r => `<tr><td>${esc(r.division)}</td><td class="num">${r.rank??''}</td><td>${esc(r.name)}</td><td>${esc(r.record_time||'')}</td><td>${esc(r.note||'')}</td></tr>`).join('')}</tbody></table></div><div class="row" style="margin-top:10px"><button class="btn" id="rcsv">결과 CSV</button></div>` : '<div class="empty">아직 입력된 기록이 없습니다.</div>'}`;
    const who = () => as.find(a => a.bib == $('#rb').value);
    $('#rb').oninput = () => { const a = who(); $('#rinfo').textContent = a ? `${a.leader_name} · ${a.class_no} · ${a.sportShort}` : ($('#rb').value ? '해당 배번 신청자가 없습니다' : ''); if (a) $('#rd').value = a.sportShort; };
    $('#radd').onclick = async () => { const a = who(); if (!a) return toast('배번을 확인하세요');
      await q(sb.from('results').insert({ competition:S.compSel, division:$('#rd').value, date:TODAY(), rank:$('#rr').value?+$('#rr').value:null, name:`${a.leader_name}(${a.class_no})`, record_time:$('#rt').value, note:$('#rn').value, applications_id:a.id }));
      toast('기록을 추가했습니다'); vComp('res'); };
    $('#rcsv') && ($('#rcsv').onclick = () => csvDownload(`${S.compSel}_결과.csv`, [['부문','순위','이름','기록','비고'], ...res.map(r => [r.division,r.rank,r.name,r.record_time,r.note])]));
  }
}

/* ============ 기록원 접근 기간 ============ */
const toLocalInput = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0,16); };
async function recorderPanel(tab){
  const box = $('#rw'); if (!box) return;
  const [w] = await q(sb.from('recorder_windows').select('*').eq('competition', S.compSel));
  const now = new Date(); const open = w && new Date(w.opens_at) <= now && now <= new Date(w.closes_at);
  const fmt = d => new Date(d).toLocaleString('ko-KR',{month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'});
  const p = S.projects.find(x => x.event_date && (x.name.includes(S.compSel) || S.compSel.includes(x.name.replace(/^\d{4}\.\s*/,''))));
  const day = p?.event_date || TODAY();
  const defOpen = w ? toLocalInput(w.opens_at) : `${day}T07:00`, defClose = w ? toLocalInput(w.closes_at) : `${day}T18:00`;
  box.innerHTML = `<div class="row"><h2 style="margin:0">기록원 접근</h2>
      <span class="tag ${open?'today':''}">${open ? '열림' : w && now < new Date(w.opens_at) ? '예약됨' : '닫힘'}</span>
      <span class="small muted">${w ? `${fmt(w.opens_at)} ~ ${fmt(w.closes_at)}` : '설정된 기간 없음'}</span></div>
    <p class="small muted" style="margin:6px 0 10px">이 기간에만 로그인 없이 기록을 입력·수정할 수 있습니다. 기간이 끝나면 자동으로 닫힙니다.</p>
    <div class="row"><label class="f">시작<input type="datetime-local" id="wo" value="${defOpen}"></label>
      <label class="f">종료<input type="datetime-local" id="wc" value="${defClose}"></label>
      <button class="btn pri" id="wsv" style="align-self:flex-end">기간 저장</button>
      ${open ? '<button class="btn danger" id="wx" style="align-self:flex-end">지금 닫기</button>' : ''}</div>`;
  $('#wsv').onclick = async () => {
    const o = new Date($('#wo').value), c = new Date($('#wc').value);
    if (isNaN(o) || isNaN(c) || c <= o) return toast('종료 시각은 시작 시각보다 뒤여야 합니다');
    if ((c - o) > 3 * 864e5 && !confirm('3일이 넘는 기간입니다. 이대로 열어 둘까요?')) return;
    await q(sb.from('recorder_windows').upsert({ competition:S.compSel, opens_at:o.toISOString(), closes_at:c.toISOString() }, { onConflict:'competition' }));
    toast('기록원 접근 기간을 저장했습니다'); recorderPanel(tab); };
  $('#wx') && ($('#wx').onclick = async () => {
    await q(sb.from('recorder_windows').update({ closes_at:new Date().toISOString() }).eq('competition', S.compSel));
    toast('기록원 접근을 닫았습니다'); recorderPanel(tab); });
}

/* ============ 예산 ============ */
function vBudget(){
  const v = $('#view');
  if (!S.budgetProject && S.projects.length) S.budgetProject = S.projects[0].id;
  const pid = S.budgetProject; const bs = S.budget.filter(b => b.project_id === pid);
  const pl = bs.reduce((s,b)=>s+(+b.planned||0),0), sp = bs.reduce((s,b)=>s+(+b.spent||0),0);
  const all = S.projects.map(p => { const x = S.budget.filter(b => b.project_id === p.id); return [p, x.reduce((s,b)=>s+(+b.planned||0),0), x.reduce((s,b)=>s+(+b.spent||0),0)]; }).filter(r => r[1]);
  v.innerHTML = `<h1>예산</h1><p class="sub">사업별로 편성하고 집행액을 기록하면 공문의 예산표와 결과보고에 그대로 들어갑니다.</p>
    ${S.projects.length ? `<div class="row" style="margin-bottom:14px"><select id="bp" aria-label="사업 선택">${S.projects.map(p => `<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.name)}</option>`).join('')}</select><span class="spacer"></span><button class="btn" id="bcsv">CSV</button></div>
    <div class="stats"><div class="stat"><b>${won(pl)}</b><span>편성액(원)</span></div><div class="stat"><b>${won(sp)}</b><span>집행액(원)</span></div><div class="stat"><b>${won(pl-sp)}</b><span>잔액(원)</span></div><div class="stat"><b>${pl?Math.round(sp/pl*100):0}%</b><span>집행률</span></div></div>
    <div class="tw"><table><thead><tr><th>구분</th><th>항목</th><th class="num">단가</th><th class="num">수량</th><th class="num">편성액</th><th class="num">집행액</th><th>집행일</th><th>상태</th><th></th></tr></thead><tbody>
    ${bs.map(b => `<tr data-b="${b.id}"><td><input data-k="category" value="${esc(b.category||'')}" style="width:90px"></td><td><input data-k="item" value="${esc(b.item)}" style="min-width:150px"></td>
      <td><input data-k="unit_price" type="number" value="${b.unit_price||0}" style="width:100px;text-align:right"></td><td><input data-k="qty" type="number" value="${b.qty||0}" style="width:70px;text-align:right"></td>
      <td><input data-k="planned" type="number" value="${b.planned||0}" style="width:110px;text-align:right"></td><td><input data-k="spent" type="number" value="${b.spent||0}" style="width:110px;text-align:right"></td>
      <td><input data-k="spent_date" type="date" value="${esc(b.spent_date||'')}"></td><td><select data-k="status">${['계획','품의','집행','정산'].map(s => `<option ${s===b.status?'selected':''}>${s}</option>`).join('')}</select></td>
      <td><button class="btn ghost danger" data-del="${b.id}" aria-label="삭제">삭제</button></td></tr>`).join('')}
    </tbody></table></div>
    <div class="row" style="margin-top:10px"><button class="btn pri" id="badd">+ 항목 추가</button><span class="small muted">단가나 수량을 바꾸면 편성액이 자동 계산됩니다.</span></div>
    ${all.length>1?`<section class="panel" style="margin-top:20px"><h2>사업별 집행 현황</h2><div class="tw"><table><thead><tr><th>사업</th><th class="num">편성</th><th class="num">집행</th><th class="num">집행률</th></tr></thead><tbody>${all.map(([p,a,b]) => `<tr><td>${esc(p.name)}</td><td class="num">${won(a)}</td><td class="num">${won(b)}</td><td class="num">${Math.round(b/a*100)}%</td></tr>`).join('')}</tbody></table></div></section>`:''}`
    : '<div class="empty">먼저 [사업·워크플로우]에서 사업을 등록하세요.</div>'}`;
  if (!S.projects.length) return;
  $('#bp').onchange = e => { S.budgetProject = +e.target.value; vBudget(); };
  $('#badd').onclick = async () => { const [r] = await q(sb.from('admin_budget').insert({ project_id:pid, category:'운영비', item:'새 항목' }).select()); S.budget.push(r); vBudget(); };
  $('#bcsv').onclick = () => csvDownload(`${projName(pid)}_예산.csv`, [['구분','항목','단가','수량','편성액','집행액','집행일','상태'], ...bs.map(b => [b.category,b.item,b.unit_price,b.qty,b.planned,b.spent,b.spent_date,b.status])]);
  v.querySelectorAll('tr[data-b]').forEach(tr => tr.querySelectorAll('[data-k]').forEach(el => el.onchange = async () => {
    const b = S.budget.find(x => x.id == tr.dataset.b); const k = el.dataset.k; let val = el.type==='number' ? (+el.value||0) : (el.value||null);
    const patch = { [k]: val };
    if (k==='unit_price'||k==='qty'){ b[k] = val; patch.planned = Math.round((+b.unit_price||0)*(+b.qty||0)); }
    await q(sb.from('admin_budget').update(patch).eq('id', b.id)); Object.assign(b, patch); vBudget(); }));
  v.querySelectorAll('[data-del]').forEach(btn => btn.onclick = async () => { if (!confirm('이 예산 항목을 삭제할까요?')) return;
    await q(sb.from('admin_budget').delete().eq('id', btn.dataset.del)); S.budget = S.budget.filter(b => b.id != btn.dataset.del); vBudget(); });
}

/* ============ 시작 ============ */
async function boot(session){
  if (!session){ S.user = null; return renderLogin(); }
  if ((session.user.email||'').toLowerCase() !== CONFIG.ADMIN_EMAIL.toLowerCase()){ await sb.auth.signOut(); return renderLogin('관리자 계정만 사용할 수 있습니다.'); }
  if (S.user && S.user.id === session.user.id) return;
  S.user = session.user; $('#root').innerHTML = '<div class="login"><p style="color:#fff">불러오는 중…</p></div>';
  try { await loadAll(); renderShell(); go('home'); } catch(e){ renderLogin('데이터를 불러오지 못했습니다: ' + (e.message||e)); }
}
sb.auth.getSession().then(({data}) => boot(data.session));
sb.auth.onAuthStateChange((ev, session) => { if (ev === 'SIGNED_OUT') { S.user = null; renderLogin(); } else if (ev === 'SIGNED_IN') boot(session); });
</script>
