<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 — 2026 제천 학교스포츠클럽 대회</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand">마이스포츠클럽<span>.</span></a>
    <nav class="site-nav">
      <a href="index.html">홈</a>
      <a href="apply.html">참가 신청</a>
      <a href="results.html">대회 결과</a>
    </nav>
  </div>
</header>

<section class="block">
  <div class="wrap">
    <span class="bib">관리자</span>
    <h2 style="margin-top:14px;">참가 신청 관리</h2>

    <!-- 로그인 전 화면 -->
    <div id="loginView">
      <p class="sub">신청 내역을 보려면 GitHub 계정으로 로그인해 주세요.</p>
      <button id="loginBtn" class="btn btn-primary">GitHub로 로그인</button>
    </div>

    <!-- 권한 없음 화면 -->
    <div id="deniedView" style="display:none;">
      <p class="sub">이 계정(<span id="deniedEmail"></span>)은 관리자 권한이 없습니다.</p>
      <button id="logoutBtnDenied" class="btn btn-ghost" style="color:var(--ink); border-color:var(--line);">로그아웃</button>
    </div>

    <!-- 관리자 화면 -->
    <div id="adminView" style="display:none;">
      <div class="filter-row" style="margin-bottom:24px;">
        <button type="button" class="filter-btn active" id="adminIndividualTabBtn">개인 신청</button>
        <button type="button" class="filter-btn" id="adminBulkTabBtn">교사 일괄 신청</button>
      </div>

      <!-- 개인 신청 목록 -->
      <div id="individualAdminSection">
        <div class="filter-row" id="filterRow"></div>
        <div style="display:flex; gap:10px; margin-bottom:20px;">
          <button id="refreshBtn" class="btn btn-ghost" style="color:var(--ink); border-color:var(--line);">새로고침</button>
          <button id="logoutBtn" class="btn btn-ghost" style="color:var(--ink); border-color:var(--line);">로그아웃</button>
        </div>
        <p id="countLabel" class="sub" style="margin-bottom:12px;"></p>
        <div style="overflow-x:auto;">
          <table class="result-table" id="appTable">
            <thead>
              <tr>
                <th>접수일시</th>
                <th>대회</th>
                <th>종목/유형</th>
                <th>희망일</th>
                <th>학교명</th>
                <th>학년/구분</th>
                <th>대표자</th>
                <th>연락처</th>
                <th>참가자</th>
                <th>비고</th>
                <th>IP</th>
              </tr>
            </thead>
            <tbody id="appTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- 교사 일괄 신청 목록 -->
      <div id="bulkAdminSection" style="display:none;">
        <div style="display:flex; gap:10px; margin-bottom:20px;">
          <button id="bulkRefreshBtn" class="btn btn-ghost" style="color:var(--ink); border-color:var(--line);">새로고침</button>
          <button id="logoutBtn2" class="btn btn-ghost" style="color:var(--ink); border-color:var(--line);">로그아웃</button>
        </div>
        <p id="bulkCountLabel" class="sub" style="margin-bottom:12px;"></p>
        <div id="bulkListContainer"></div>
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="wrap">
    <span>마이스포츠클럽 · 2026 제천 학교스포츠클럽 대회</span>
    <span>관리자 전용 페이지</span>
  </div>
</footer>

<script src="config.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
